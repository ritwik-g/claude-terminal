appId: com.ritwikg.claude-terminal
productName: Claude Terminal
copyright: Ritwik G

directories:
  output: release
  buildResources: build

# Only the bundled main process, the built renderer, and the manifest. The
# server is bundled INTO main.mjs, so server/ itself is not shipped.
files:
  - dist-electron/**
  - dist/**
  - package.json
  - '!**/*.map'

# node-pty is a native module: its .node binary and, critically, its
# spawn-helper must be real files on disk with the exec bit, not entries inside
# app.asar. Leaving it packed is the classic "posix_spawnp failed" in a
# packaged Electron app.
asarUnpack:
  - '**/node_modules/node-pty/**'

# Each artifact names its own architecture, so the two macOS builds can live
# side by side on one release without colliding.
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

mac:
  category: public.app-category.developer-tools
  # No arch pinned: each build produces its host's architecture. CI runs one
  # job on an Apple Silicon runner and one on an Intel runner, which is far
  # more reliable for a native module than cross-compiling or a universal
  # binary built from a single host.
  target:
    - dmg
    - zip
  icon: build/icon.icns
  # Unsigned: no Developer ID here. Hardened runtime without a signature just
  # makes Gatekeeper louder, so leave it off and document the xattr step.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    # No mic, camera or location use — declare nothing rather than inherit.
    NSSupportsAutomaticGraphicsSwitching: true

dmg:
  title: Claude Terminal
  # No custom window layout and no background image. dmgbuild tries to install
  # a .background/background.tiff into the mounted volume and dies with
  # FileNotFoundError on GitHub's macOS runners — it works locally, so this is
  # CI-only and cost a build to find. electron-builder's default layout still
  # ships the app alongside an /Applications alias, which is all the window
  # `background: null` is load-bearing: without it electron-builder supplies a
  # built-in background image, and dmgbuild dies installing it on GitHub's
  # macOS runners (FileNotFoundError on .background/background.tiff). Works
  # locally, fails only in CI.
  background: null
  writeUpdateInfo: false
  # Restore the drag target. Dropping the whole `contents` block to dodge the
  # background bug also removed the /Applications alias, so the released DMG
  # opened with nothing to drag the app onto.
  contents:
    - x: 150
      y: 180
      type: file
    - x: 390
      y: 180
      type: link
      path: /Applications

linux:
  category: Development
  target:
    - AppImage
  icon: build/icon.png
  synopsis: Attention-ranked workspace for Claude Code sessions
  desktop:
    entry:
      Terminal: 'false'
      Type: Application

# Native deps are rebuilt for Electron's ABI at package time.
npmRebuild: true

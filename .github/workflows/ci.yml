name: CI

# Runs on pull requests as well as pushes, which is the point: until now
# nothing checked a contribution before it landed. `pull_request` (not
# `pull_request_target`) is deliberate — a fork's code runs with a read-only
# token and no access to secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # node-gyp imports distutils, removed in Python 3.12; node-pty is built
      # from source here. Same reasoning as release.yml — Linux only.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'

      - name: Point node-gyp at a Python with distutils
        shell: bash
        run: echo "npm_config_python=$(node scripts/find-python.mjs)" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build renderer and main process
        run: |
          npm run build
          npm run build:electron

      # These three build a throwaway HOME with synthetic transcripts and a stub
      # `claude`, so they are hermetic. test:search and smoke are deliberately
      # excluded: both assert against the developer's real ~/.claude corpus and
      # a server already running, neither of which exists on a runner.
      - name: Tests
        run: |
          npm run test:artifacts
          npm run test:branch
          npm run test:restore

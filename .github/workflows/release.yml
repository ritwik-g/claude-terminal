name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` builds and publishes.
# workflow_dispatch is there so a release can be re-cut without moving a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

# Least privilege by default. Each job re-grants only what it needs: the build
# job runs npm and electron-builder — a token in its .git/config would just be
# sitting there for any postinstall script to find.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One failing architecture should not throw away the others' artifacts.
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures come off the Apple Silicon runner. Xcode
          # targets x86_64 natively, and the cross-built artifacts are genuinely
          # x86_64 down to node-pty's pty.node and spawn-helper (verified with
          # lipo). This also avoids depending on the Intel `macos-13` runners,
          # which GitHub is retiring — a job requesting one sat unscheduled
          # indefinitely rather than failing.
          - os: macos-14
            label: macOS (arm64 + x64)
            # Two invocations, NOT one `--mac --arm64 --x64`. electron-builder
            # builds the two DMGs in parallel and both mount a volume named
            # `Claude Terminal`, so `hdiutil detach /Volumes/Claude Terminal`
            # races and the build fails — intermittently, which is worse: the
            # first two releases happened to win the race.
            platform: --mac --arm64
            platform_extra: --mac --x64
          - os: ubuntu-latest
            label: Linux x64
            platform: --linux
            platform_extra: ''

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # node-gyp imports distutils, removed in Python 3.12. On Linux the
      # default python3 is newer, so pin one that still has it.
      #
      # Deliberately NOT done on macOS: setup-python puts its interpreter ahead
      # of /usr/bin/python3 on PATH, and dmg-builder runs `python3` for its
      # vendored dmgbuild — which then fails installing the DMG background and
      # takes the whole package step with it. The runner's own python3 is 3.9
      # and has distutils, and scripts/find-python.mjs already prefers it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'

      - name: Point node-gyp at a Python with distutils
        shell: bash
        run: echo "npm_config_python=$(node scripts/find-python.mjs)" >> "$GITHUB_ENV"

      # AppImage packaging needs FUSE; the runner image does not ship it.
      - name: Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm

      - run: npm ci

      - name: Build renderer and main process
        run: |
          npm run build
          npm run build:electron

      # electron-builder rebuilds node-pty for Electron's ABI itself, and
      # builds for the host architecture (see electron-builder.yml).
      - name: Package
        shell: bash
        run: |
          npx electron-builder ${{ matrix.platform }} --publish never
          if [ -n "${{ matrix.platform_extra }}" ]; then
            npx electron-builder ${{ matrix.platform_extra }} --publish never
          fi
        env:
          # Unsigned build: no Developer ID secret is configured. Tell
          # electron-builder not to go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check something was produced
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers in release/ — packaging silently produced nothing" >&2
            ls -la release/ || true
            exit 1
          fi
          printf '  %s\n' "${files[@]}"

      # These builds are unsigned, so a digest published from the build itself is
      # the only way a downloader can tell this artifact from any other.
      - name: Checksum the installers
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          out="SHA256SUMS-${{ matrix.os }}.txt"
          : > "$out"
          for f in *.dmg *.zip *.AppImage; do
            sum=$(shasum -a 256 "$f" | awk '{print $1}')
            # The product name contains a space and GitHub replaces spaces with
            # dots in release asset names, so a digest recorded under the local
            # filename names a file the downloader does not have and
            # `shasum -c` fails on every line. Record the downloaded name.
            printf '%s  %s\n' "$sum" "${f// /.}" >> "$out"
          done
          cat "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Only this job publishes, so only this job can write.
      contents: write
      # Signed provenance: proves these artifacts came from this workflow, at
      # this commit, rather than from someone's laptop. It is what substitutes
      # for the Developer ID signature this project cannot afford.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts/

      # Provenance attestation is rejected for user-owned PRIVATE repositories
      # ("Feature not available … please make this repository public"), which
      # failed the whole publish step after both builds had succeeded. Skipped
      # rather than forced: it starts working by itself the moment the repo is
      # public, and a release that cannot be attested is still a release.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            **macOS** — download the `.dmg` for your chip
            (`arm64` for Apple Silicon, `x64` for Intel), open it, and drag
            **Claude Terminal** to Applications.

            Then run this — you need it, once per download:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Claude Terminal.app"
            ```

            Without it macOS says the app **"is damaged and can't be opened"**
            and offers only *Move to Bin*. It is not damaged: these builds are
            ad-hoc signed rather than signed with an Apple Developer ID, and
            Gatekeeper reports that as damage. Do **not** move it to the Bin —
            run the command, and it opens normally from then on.

            Right-click - *Open* does **not** help here; that path exists for
            apps signed but not notarized, and this one has no *Open* option at
            all. Building from source avoids the whole problem, because an app
            you build yourself is never quarantined - see the README.

            **Linux** — download the `.AppImage`, `chmod +x` it, and run it.
            Untested; the headless server (`npm start`) is the supported path.

            ## Verify what you downloaded

            These builds are unsigned, so verify them rather than trusting the
            filename. Digests are in `SHA256SUMS-*.txt` attached below:

            ```bash
            shasum -a 256 -c SHA256SUMS-macos-14.txt
            ```

            Installers built from a public repository also carry signed build
            provenance tying them to this workflow and commit:

            ```bash
            gh attestation verify Claude.Terminal-0.4.0-mac-arm64.dmg --repo ritwik-g/claude-terminal
            ```

            ## Notes

            Launch by double-clicking; quit with ⌘Q. Quitting closes every
            terminal the app started and asks first if any are still running —
            sessions in your own terminals are never affected, and every session
            keeps its transcript either way.

            The app never writes to `~/.claude`. Its own state lives in
            `~/.claude-terminal/`.
